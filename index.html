<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud LearnX - Tutor Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            max-width: 650px; 
            width: 100%; 
        }
        h1, h2 { color: #2c3e50; text-align: center; }
        
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 15px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: #64748b;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 0;
            border-radius: 0;
        }
        .tab-btn:hover { background: #f8fafc; color: #2563eb; }
        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            background: none;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background: #fafafa; box-sizing: border-box;
        }
        
        button { 
            background: #3498db; color: white; border: none; padding: 12px 20px; width: 100%; 
            border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; 
            transition: background 0.3s; margin-top: 10px; 
        }
        button:hover { background: #2980b9; }
        .btn-secondary { background: #7f8c8d; }
        .btn-secondary:hover { background: #6c7a7d; }
        .btn-green { background: #27ae60; }
        .btn-green:hover { background: #219a52; }

        #upload-container, #status-board { display: none; }
        #status-board, #onboard-status { 
            margin-top: 20px; padding: 15px; background: #e8f8f5; 
            border-left: 4px solid #1abc9c; border-radius: 4px; display: none;
        }
        .progress-text { font-size: 14px; color: #555; margin-top: 5px; }
        .credits-bar { text-align: right; font-size: 13px; color: #666; margin-bottom: 15px; }
        .credits-count { font-weight: bold; color: #2c3e50; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <h1>Cloud LearnX Portal</h1>

    <!-- AUTH BOX -->
    <div id="auth-box">
        <h2>Sign In or Create Account</h2>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tutor@cloudlearnx.com">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button onclick="handleLogin()">Log In</button>
        <button class="btn-secondary" onclick="handleSignup()">Sign Up</button>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="upload-container">
        <div class="credits-bar">
            Credits remaining: <span class="credits-count" id="credits-display">—</span>
            &nbsp;|&nbsp; <a href="#" onclick="handleLogout()">Log Out</a>
        </div>

        <!-- TABS -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('auto-marker')">Auto-Marker</button>
            <button class="tab-btn" onclick="switchTab('onboard-student')">Add Student</button>
        </div>

        <!-- TAB 1: AUTO-MARKER -->
        <div id="tab-auto-marker" class="tab-content active">
            <form id="upload-form">
                <div class="form-group">
                    <label>Student Paper (PDF)</label>
                    <input type="file" id="student_paper" accept="application/pdf" required>
                </div>
                <div class="form-group">
                    <label>Marking Scheme (PDF)</label>
                    <input type="file" id="marking_scheme" accept="application/pdf" required>
                </div>
                <button type="submit" id="submit-btn">Grade Paper (1 Credit)</button>
            </form>

            <div id="status-board">
                <h3 style="margin-top:0;">Status: <span id="status-indicator">Uploading...</span></h3>
                <div class="progress-text" id="progress-details">Initializing...</div>
            </div>

            <!-- PAYHERE CREDITS -->
            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
            <div style="text-align: center;">
                <p style="margin-bottom: 10px; font-weight: bold;">Need more credits?</p>
                <form id="payhere-form" method="POST" action="https://sandbox.payhere.lk/pay/checkout">
                    <input type="hidden" name="merchant_id"  id="ph-merchant-id">
                    <input type="hidden" name="return_url"   id="ph-return-url">
                    <input type="hidden" name="cancel_url"   id="ph-cancel-url">
                    <input type="hidden" name="notify_url"   id="ph-notify-url">
                    <input type="hidden" name="order_id"     id="ph-order-id">
                    <input type="hidden" name="items"        value="100 Grading Credits">
                    <input type="hidden" name="currency"     id="ph-currency">
                    <input type="hidden" name="amount"       id="ph-amount">
                    <input type="hidden" name="hash"         id="ph-hash">
                    <input type="hidden" name="first_name"   value="Tutor">
                    <input type="hidden" name="last_name"    value="User">
                    <input type="hidden" name="email"        id="ph-email">
                    <input type="hidden" name="phone"        value="0771234567">
                    <input type="hidden" name="address"      value="No.1, Galle Road">
                    <input type="hidden" name="city"         value="Colombo">
                    <input type="hidden" name="country"      value="Sri Lanka">

                    <button type="button" class="btn-green" onclick="buyCredits()">
                        Buy 100 Credits (LKR 10,000)
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 2: STUDENT ONBOARDING -->
        <div id="tab-onboard-student" class="tab-content">
            <form id="onboard-form" onsubmit="handleStudentOnboard(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="stu_full_name" placeholder="e.g. Kalan Disath" required>
                    </div>
                    <div class="form-group">
                        <label>Preferred Name</label>
                        <input type="text" id="stu_pref_name" placeholder="e.g. Kalan">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Year Group *</label>
                        <select id="stu_year_group" required>
                            <option value="Year 10" selected>Year 10 (IGCSE)</option>
                            <option value="Year 11">Year 11 (IGCSE)</option>
                            <option value="Year 12 (AS)">Year 12 (AS-Level)</option>
                            <option value="Year 13 (A2)">Year 13 (A2-Level)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Exam Board / Syllabus *</label>
                        <select id="stu_syllabus" required>
                            <option value="Pearson Edexcel|UK_Pearson_Edexcel|4MA1_Higher">Pearson Edexcel (4MA1 Higher)</option>
                            <option value="Cambridge CAIE|UK_Cambridge_CAIE|0580_Extended">Cambridge CAIE (0580 Extended)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Active Weaknesses (Comma separated)</label>
                    <input type="text" id="stu_weaknesses" placeholder="Algebraic Fractions, Trigonometry">
                </div>

                <div class="form-group">
                    <label>Interests for Word Problems (Comma separated)</label>
                    <input type="text" id="stu_interests" placeholder="Robotics, Space Exploration">
                </div>

                <!-- ADD THESE TO THE Add Student TAB FORM -->

                <div class="form-row">
                    <div class="form-group">
                        <label>Current Working Grade / Level *</label>
                        <select id="stu_current_level" required>
                            <option value="Grade 4 (C/D boundary)">Grade 4 (Working below target)</option>
                            <option value="Grade 5 (C/B boundary)" selected>Grade 5 (Solid Foundation)</option>
                            <option value="Grade 6 (B grade)">Grade 6 (Targeting A/A*)</option>
                            <option value="Grade 7 (A grade)">Grade 7 (Strong Higher tier)</option>
                            <option value="Grade 8 (A* grade)">Grade 8 (Top Performing)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Attitude & Mindset Towards Math</label>
                        <select id="stu_mindset">
                            <option value="Anxious & Lacks Confidence">Anxious / Overwhelmed by Multi-step Problems</option>
                            <option value="Capable but Careless">Capable, but Rushes & Makes Arithmetic Errors</option>
                            <option value="Highly Motivated & Fast-Paced">Highly Motivated & Enjoys Tough Challenges</option>
                            <option value="Rote Learner (Lacks Conceptual Depth)">Relies on Memorisation / Struggles with Application</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Tutor Assessment (Mindset & Technical Summary)</label>
                    <textarea id="stu_tutor_summary" rows="3" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;" 
                        placeholder="Internal notes for AI prompting: e.g., High potential, gets discouraged quickly when algebra gets dense. Needs clear step-by-step wins."></textarea>
                </div>

                <div class="form-group">
                    <label>Parent Summary Report (Parent-Facing Description)</label>
                    <textarea id="stu_parent_summary" rows="3" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;" 
                        placeholder="Polite, encouraging update for parents: e.g., Amy shows strong spatial intuition, but needs to focus on showing structured working in algebra."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Guardian Name</label>
                        <input type="text" id="stu_guardian" placeholder="Parent Name">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="text" id="stu_whatsapp" placeholder="+94 77...">
                    </div>
                </div>

                <button type="submit" class="btn-green" id="onboard-btn">Save to Supabase</button>
            </form>

            <div id="onboard-status">
                <h3 style="margin:0; color:#16a34a;" id="onboard-msg">Profile Saved!</h3>
                <div class="progress-text" id="onboard-id-display"></div>
            </div>
        </div>

    </div>
</div>

<script>
    const SUPABASE_URL      = "https://rswfvxzwdloggvymjkos.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJzd2Z2eHp3ZGxvZ2d2eW1qa29zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTQxNDksImV4cCI6MjEwMDU5MDE0OX0.J-5_E7yROrAmdjkA9XJV7qUuj__gvOIKoS2ZzvLlauQ";
    const supabaseClient    = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── Session restore on page load ─────────────────────────────────────
    window.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('access_token');
        if (token) {
            const { data, error } = await supabaseClient.auth.getUser(token);
            if (data?.user) {
                showDashboard(data.user.id, data.user.email);
            } else {
                localStorage.removeItem('access_token');
            }
        }
    });

    // ── Tab Navigation ───────────────────────────────────────────────────
    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'auto-marker') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-auto-marker').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-onboard-student').classList.add('active');
        }
    }

    // ── Auth handlers ────────────────────────────────────────────────────
    async function handleSignup() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!email || !password) return alert("Please enter email and password.");
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert("Signup error: " + error.message);
        else alert("Signup successful! Check your email for a confirmation link.");
    }

    async function handleLogin() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!email || !password) return alert("Please enter email and password.");
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            alert("Login error: " + error.message);
        } else {
            localStorage.setItem('access_token', data.session.access_token);
            showDashboard(data.user.id, data.user.email);
        }
    }

    function handleLogout() {
        supabaseClient.auth.signOut();
        localStorage.removeItem('access_token');
        document.getElementById('upload-container').style.display = 'none';
        document.getElementById('auth-box').style.display = 'block';
    }

    async function showDashboard(userId, email) {
        document.getElementById('auth-box').style.display       = 'none';
        document.getElementById('upload-container').style.display = 'block';
        if (email) document.getElementById('ph-email').value = email;
        await refreshCredits();
    }

    // ── Credit display ───────────────────────────────────────────────────
    async function refreshCredits() {
        try {
            const token    = localStorage.getItem('access_token');
            const response = await fetch('/api/v1/credits', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            document.getElementById('credits-display').innerText = data.credits ?? '—';
        } catch (e) {
            console.error("Could not fetch credits:", e);
        }
    }

    // ── Student Onboarding Handler (Supabase direct write) ────────────────
    async function handleStudentOnboard(e) {
        e.preventDefault();
        const btn = document.getElementById('onboard-btn');
        btn.disabled = true;
        btn.innerText = "Saving to Supabase...";

        const fullName = document.getElementById('stu_full_name').value.trim();
        const prefName = document.getElementById('stu_pref_name').value.trim() || fullName.split(' ')[0];
        const yearGroup = document.getElementById('stu_year_group').value;
        const [boardName, countryCurriculum, syllabusCode] = document.getElementById('stu_syllabus').value.split('|');

        const parseCsv = (str) => str ? str.split(',').map(s => s.trim()).filter(Boolean) : [];
        const weaknesses = parseCsv(document.getElementById('stu_weaknesses').value);
        const interests = parseCsv(document.getElementById('stu_interests').value);

        // Add these extra extractions in handleStudentOnboard(e):
        const currentLevel   = document.getElementById('stu_current_level').value;
        const mindsetTag     = document.getElementById('stu_mindset').value;
        const tutorSummary   = document.getElementById('stu_tutor_summary').value.trim();
        const parentSummary  = document.getElementById('stu_parent_summary').value.trim();


        const studentId = `STU-${new Date().toISOString().slice(0,7).replace('-','')}-${fullName.replace(/\s+/g,'').toUpperCase().slice(0,4)}`;
        const nowIso = new Date().toISOString();

        // Build JSONB payload matching schema
        const profileData = {
            student_id: studentId,
            meta: { created_at: nowIso, last_updated: nowIso },
            core_identity: {
                full_name: fullName,
                preferred_name: prefName,
                year_group: yearGroup,
                academic_stage: "IGCSE",
                country_curriculum: countryCurriculum,
                exam_board: boardName,
                syllabus_code: syllabusCode,
                target_grade: "Grade 8 (A*)",
                baseline_grade: currentLevel
            },
            contact_and_guardian: {
                guardian_name: document.getElementById('stu_guardian').value.trim(),
                whatsapp_number: document.getElementById('stu_whatsapp').value.trim()
            },
            pedagogy_and_personalisation: {
                interests: interests.length ? interests : ["Technology"],
                frustration_triggers: [],
                mindset_profile: {
                    attitude_tag: mindsetTag,
                    internal_tutor_notes: tutorSummary
                }
            },
            academic_diagnosis: {
                active_weakness_tags: weaknesses,
                known_misconceptions: weaknesses.map(w => ({ tag: w, severity: "Medium" }))
                
            },
            parent_reporting: {
            parent_visible_summary: parentSummary,
            last_updated: nowIso
            },
            mastery_matrix: {}
        };

        try {
            // Upsert directly into Supabase JSONB table
            const { error } = await supabaseClient
                .from('student_profiles')
                .upsert({
                    id: studentId,
                    student_name: fullName,
                    year_group: yearGroup,
                    profile_data: profileData,
                    updated_at: nowIso
                });

            if (error) throw error;

            document.getElementById('onboard-status').style.display = 'block';
            document.getElementById('onboard-msg').innerText = "✅ Saved to Supabase!";
            document.getElementById('onboard-id-display').innerText = `ID: ${studentId} (${prefName})`;
            document.getElementById('onboard-form').reset();

        } catch (err) {
            alert("Error saving student profile: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "Save to Supabase";
        }
    }

    // ── PayHere — fetch hash from backend then submit form ───────────────
    async function buyCredits() {
        const token = localStorage.getItem('access_token');
        if (!token) return alert("Please log in first.");

        try {
            const res  = await fetch('/api/v1/payhere-hash', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || "Could not generate payment hash");
            }

            const ph = await res.json();

            document.getElementById('ph-merchant-id').value = ph.merchant_id;
            document.getElementById('ph-order-id').value    = ph.order_id;
            document.getElementById('ph-amount').value      = ph.amount;
            document.getElementById('ph-currency').value    = ph.currency;
            document.getElementById('ph-hash').value        = ph.hash;
            document.getElementById('ph-notify-url').value  = ph.notify_url;
            document.getElementById('ph-return-url').value  = ph.return_url;
            document.getElementById('ph-cancel-url').value  = ph.cancel_url;

            document.getElementById('payhere-form').submit();

        } catch (e) {
            alert("Payment setup error: " + e.message);
        }
    }

    // ── Grading form ─────────────────────────────────────────────────────
    document.getElementById('upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const token = localStorage.getItem('access_token');
        if (!token) return alert("Please log in again.");

        const submitBtn      = document.getElementById('submit-btn');
        const statusBoard    = document.getElementById('status-board');
        const statusIndicator = document.getElementById('status-indicator');
        const progressDetails = document.getElementById('progress-details');

        const formData = new FormData();
        formData.append('student_paper',   document.getElementById('student_paper').files[0]);
        formData.append('marking_scheme',  document.getElementById('marking_scheme').files[0]);
        formData.append('token',           token);

        submitBtn.disabled    = true;
        submitBtn.innerText   = "Processing...";
        statusBoard.style.display = 'block';
        statusIndicator.style.color = '';

        try {
            const response = await fetch('/api/v1/grade-paper', { method: 'POST', body: formData });
            const data     = await response.json();

            if (response.ok && data.job_id) {
                statusIndicator.innerText  = "Queued";
                progressDetails.innerText  = `Job ${data.job_id} — processing in background...`;
                pollStatus(data.job_id);
            } else {
                throw new Error(data.detail || "Grading request failed");
            }
        } catch (err) {
            statusIndicator.innerText    = "Error";
            statusIndicator.style.color  = "red";
            progressDetails.innerText    = err.message;
            submitBtn.disabled           = false;
            submitBtn.innerText          = "Grade Paper (1 Credit)";
        }
    });

    // ── Status polling ───────────────────────────────────────────────────
    async function pollStatus(jobId) {
        const statusIndicator = document.getElementById('status-indicator');
        const progressDetails = document.getElementById('progress-details');
        const submitBtn       = document.getElementById('submit-btn');

        const interval = setInterval(async () => {
            try {
                const response = await fetch(`/api/v1/status/${jobId}`);
                const data     = await response.json();
                const status   = data.details.status;

                statusIndicator.innerText = status;

                if (status === "Completed") {
                    clearInterval(interval);
                    statusIndicator.style.color = "green";
                    const s = data.details.summary;
                    progressDetails.innerHTML = `
                        <strong>Grading Complete!</strong><br>
                        Paper: ${s.paper_title || 'N/A'}<br>
                        Score: ${s.total_marks_awarded} / ${s.total_marks_possible}
                              (${s.percentage}%)<br>
                        Flagged: ${s.questions_flagged ? s.questions_flagged : 'None'}
                    `;
                    submitBtn.disabled  = false;
                    submitBtn.innerText = "Grade Another Paper";
                    await refreshCredits();
                } else if (status === "Failed") {
                    clearInterval(interval);
                    statusIndicator.style.color = "red";
                    progressDetails.innerText   = `Error: ${data.details.error}`;
                    submitBtn.disabled  = false;
                    submitBtn.innerText = "Retry";
                }
            } catch (err) {
                console.error("Polling error:", err);
            }
        }, 3000);
    }
</script>
</body>
</html>
